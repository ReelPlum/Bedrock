name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Unit, replay and format tests
        run: cargo test --workspace
      - name: 100 000-stroke performance budget
        run: cargo test --release -p bedrock-core --test perf -- --ignored --nocapture
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The WASI SDK builds the C++ Ink Stroke Modeler for WebAssembly;
      # build-web.sh downloads it when it is not cached.
      - uses: actions/cache@v4
        with:
          path: .wasi-sdk
          key: wasi-sdk-${{ runner.os }}-${{ hashFiles('scripts/install-wasi-sdk.sh') }}
      # binaryen's wasm-opt shrinks the WebAssembly; build-web.sh fails
      # without it here (BEDROCK_REQUIRE_WASM_OPT) instead of skipping it.
      - name: Install wasm-opt (binaryen)
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_123/bin" >> "$GITHUB_PATH"
      - name: Build WebAssembly
        env:
          BEDROCK_REQUIRE_WASM_OPT: '1'
        run: ./scripts/build-web.sh
      - name: Install Playwright
        working-directory: apps/web
        run: |
          npm install --no-package-lock
          npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: apps/web
        run: npm test
      # The Obsidian plugin is built from the same web app and WebAssembly.
      - name: Obsidian plugin tests
        working-directory: apps/obsidian
        run: |
          npm install --no-package-lock
          npm test
      - name: Build Obsidian plugin
        working-directory: apps/obsidian
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: bedrock-obsidian-plugin
          path: apps/obsidian/dist/
