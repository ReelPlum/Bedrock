name: Pages

# Publishes the web app to GitHub Pages: https://reelplum.github.io/Bedrock/
# Deploys from main only. One-time setup in the repository:
# Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      # The WASI SDK builds the C++ Ink Stroke Modeler for WebAssembly;
      # build-web.sh downloads it when it is not cached.
      - uses: actions/cache@v4
        with:
          path: .wasi-sdk
          key: wasi-sdk-${{ runner.os }}-${{ hashFiles('scripts/install-wasi-sdk.sh') }}
      # binaryen's wasm-opt shrinks the WebAssembly; build-web.sh fails
      # without it here (BEDROCK_REQUIRE_WASM_OPT) instead of skipping it.
      - name: Install wasm-opt (binaryen)
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_123/bin" >> "$GITHUB_PATH"
      - name: Build WebAssembly
        env:
          BEDROCK_REQUIRE_WASM_OPT: '1'
        run: ./scripts/build-web.sh
      - name: Collect the site
        run: |
          mkdir -p _site
          cd apps/web
          cp -r index.html style.css sw.js manifest.webmanifest src pkg dict icons train welcome terms ../../_site/
          touch ../../_site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
