[workspace]
resolver = "2"
members = ["crates/bedrock-core", "crates/bedrock-web", "crates/bedrock-pdf", "crates/ink-stroke-modeler"]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/ReelPlum/Bedrock"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The app download: libraries that run rarely or on small inputs (PDF
# import, spelling, ZIP structure, SVG reading, PNG, Base64) are built for
# size. The engine, renderer, JSON and deflate stay at full speed: building
# those for size too saves more but slows the pen (perf test). See
# openspec/specs/web-app-delivery.
[profile.release.package.hayro-syntax]
opt-level = "z"
[profile.release.package.spellbook]
opt-level = "z"
[profile.release.package.zip]
opt-level = "z"
[profile.release.package.roxmltree]
opt-level = "z"
[profile.release.package.png]
opt-level = "z"
[profile.release.package.base64]
opt-level = "z"
