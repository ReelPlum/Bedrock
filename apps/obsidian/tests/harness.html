<!doctype html>
<html>
<head><meta charset="utf-8"><title>Bedrock host harness</title>
<!-- Obsidian's own window has this policy (index.html of Obsidian 1.15.1),
     and a page written into an iframe (srcdoc) inherits it. -->
<meta http-equiv="Content-Security-Policy" content="style-src 'unsafe-inline' 'self' https://fonts.googleapis.com">
</head>
<body style="margin:0">
<!-- Plays Obsidian's part for the browser tests: the plugin's real bridge,
     session, indexer and pages (inline-app.js, with the web app packed by
     build.mjs, served as /bundle.json), with an in-memory vault instead of
     Obsidian's. -->
<iframe id="frame" style="width:1024px;height:768px;border:0;display:block"></iframe>
<script type="module">
import { HostBridge } from '/obsidian/src/bridge.js';
import { createSession } from '/obsidian/src/session.js';
import { Indexer, strokesForIndexPlace } from '/obsidian/src/index-note.js';
import { readZip, text } from '/obsidian/src/zip.js';
import { FakeVault } from '/obsidian/tests/fake-vault.mjs';
import { askAtLaunch } from '/obsidian/src/consent.js';
import { InlineApp } from '/obsidian/src/inline-app.js';
import { watchKeyboard } from '/obsidian/src/keyboard.js';

const webApp = new InlineApp(await (await fetch('/bundle.json')).json());

const frame = document.getElementById('frame');
const vault = new FakeVault();
const indexer = new Indexer(vault);
const calls = [];
const cameras = new Map();
let bridge = null;
let session = null;
let file = null;
let keyboard = null;

/** A PDF's page as the plugin draws it (PdfPages, with Obsidian's PDF.js):
 *  here every PDF has three pages, each a picture saying its number. */
async function pdfPage(path, page, width) {
  const c = document.createElement('canvas');
  c.width = width;
  c.height = Math.round(width * 1.3);
  const g = c.getContext('2d');
  g.fillStyle = '#fff';
  g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = '#000';
  g.font = '40px sans-serif';
  g.fillText(`${path} p${page}`, 10, 60);
  const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
  calls.push(['pdf-page', path, page]);
  return { count: 3, png: await blob.arrayBuffer() };
}

window.host = {
  vault,
  /** Starting links of new notes, as the plugin's newNote leaves them. */
  starts: new Map(),
  /** What the plugin does when Obsidian starts: ask for the invite code
   *  and consent. The "window" is a div here. Resolves to how it went. */
  launch() {
    this.windows = 0;
    return askAtLaunch({
      doc: document,
      page: (probe) => webApp.page('welcome', { probe }),
      open: (w) => {
        this.windows += 1;
        const el = document.createElement('div');
        el.id = 'consent-window';
        el.style.cssText = 'position:fixed;inset:0;width:620px;height:760px;background:#fff';
        document.body.append(el);
        w.mount(el);
        return { close() { el.remove(); w.onClose(); } };
      },
    });
  },
  calls,
  /** The iPad's on-screen keyboard, as Obsidian reports it: it covers the
   *  bottom `height` px of the window without resizing anything, sets
   *  --keyboard-height and fires keyboardWillShow / keyboardWillHide. */
  keyboard(height) {
    document.documentElement.style.setProperty('--keyboard-height', `${height}px`);
    window.dispatchEvent(new Event(height ? 'keyboardWillShow' : 'keyboardWillHide'));
  },
  get session() { return session; },
  get bridge() { return bridge; },
  /** Open a vault file in the iframe, as the plugin's view does;
   *  `viewOnly` as on a desktop computer. */
  async open(path, { viewOnly = false } = {}) {
    // As the view does when it closes: write a waiting index note.
    await session?.flushIndex();
    bridge?.close();
    file = vault.files.get(path) || (await vault.createBinary(path, new ArrayBuffer(0)));
    let ready;
    const isReady = new Promise((r) => { ready = r; });
    session = createSession({
      viewOnly,
      vault,
      file: () => file,
      indexer,
      kv: { get: (k) => cameras.get(k), set: async (k, v) => { cameras.set(k, v); } },
      // As the plugin's linkableFiles: not this note or index notes; the
      // link text is the path, without .md for Markdown notes.
      listFiles: async (source) => {
        calls.push(['list', source]);
        return vault.getFiles()
          .filter((f) => f.path !== source && !f.path.startsWith('Bedrock index/') && !f.path.endsWith('.bedrock.md'))
          .map((f) => ({ path: f.path, link: f.path.replace(/\.md$/, '') }));
      },
      pdfPage,
      openLink: (target, source) => calls.push(['open', target, source]),
      copyLink: async (stroke, source) => { calls.push(['copy', stroke, source]); },
      start: () => { const st = host.starts.get(file.path) ?? null; host.starts.delete(file.path); return st; },
      // As the plugin's renameNote: in its folder, never over another file.
      rename: async (name) => {
        const dir = file.path.includes('/') ? file.path.slice(0, file.path.lastIndexOf('/') + 1) : '';
        const to = `${dir}${name}.bedrock`;
        if (vault.files.has(to)) { calls.push(['refused', to]); return file.basename; }
        await this.renameInObsidian(to);
        return file.basename;
      },
      wasm: () => webApp.wasmModule(),
      onReady: () => { tellInset(keyboard.covered()); ready(); },
    });
    bridge = new HostBridge(() => frame.contentWindow, session.handlers);
    bridge.listen(window);
    // As the plugin's view does: tell the app how much of it is covered.
    const tellInset = (bottom) => bridge.send('inset', { bottom }, 1000).catch(() => null);
    keyboard?.stop();
    keyboard = watchKeyboard(window, frame, tellInset);
    frame.srcdoc = webApp.page('app', { viewOnly });
    await isReady;
  },
  /** Obsidian renames or moves the open file (its file explorer, or the
   *  plugin's file manager call): the index note follows, as the plugin's
   *  rename handler does, and the view tells the app, as its onRename does. */
  async renameInObsidian(to) {
    const from = file.path;
    calls.push(['rename', from, to]);
    await vault.rename(file, to);
    if (file.data.byteLength) await indexer.rename(from, to, file.data.slice(0));
    await bridge.send('renamed', { name: file.basename });
  },
  /** What the vault holds: the note's entries and its index note. */
  async files(path) {
    const f = vault.files.get(path);
    const z = await readZip(f.data);
    const note = JSON.parse(text(z.get('note.json')) || '{}');
    const index = vault.files.get(indexer.pathFor(path))?.data ?? null;
    return { strokes: (note.strokes || []).length, title: note.title ?? null, links: text(z.get('links.md')), index, size: f.data.byteLength, noteLinks: note.noteLinks ?? null, tags: note.tags ?? null };
  },
  /** Click a search result: `text` as found in the note's index note.
   *  Works out the ink as the plugin does and asks the open view to show
   *  it. Resolves to the stroke ids and the app's answer. */
  async searchHit(path, text) {
    const markdown = vault.files.get(indexer.pathFor(path)).data;
    const i = markdown.indexOf(text);
    const strokes = await strokesForIndexPlace(path, vault.files.get(path).data, markdown, { match: { content: markdown, matches: [[i, i + text.length]] } });
    return { strokes, shown: await bridge.send('show', { strokes }) };
  },
  /** Another device changed the file: tell the view, as the plugin does. */
  async outsideChange(path, fromPath) {
    vault.outsideChange(path, vault.files.get(fromPath).data.slice(0));
    if (session.isOutsideChange(file)) await bridge.send('reload');
  },
};
</script>
</body>
</html>
