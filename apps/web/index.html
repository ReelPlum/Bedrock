<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bedrock">
  <meta name="theme-color" content="#fbfaf6">
  <meta name="description" content="Bedrock: handwritten notes on an infinite canvas, made for Apple Pencil.">
  <title>Bedrock</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" aria-label="Drawing canvas">
    <canvas id="base"></canvas>
    <canvas id="overlay"></canvas>
    <canvas id="marks" aria-hidden="true"></canvas>
    <div id="hover-cursor" class="hover-cursor" hidden aria-hidden="true"></div>
  </main>

  <header class="topbar" id="topbar">
    <button class="icon" id="btn-library" title="Notes" aria-label="Notes">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <input id="title" class="title" placeholder="Untitled note" aria-label="Note title" autocomplete="off" spellcheck="false">
    <span id="save-state" class="save-state" role="status" aria-live="polite">Saved</span>
    <button class="icon" id="btn-menu" title="More" aria-label="More" aria-haspopup="true">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
    </button>
  </header>

  <nav class="toolbar" id="toolbar" aria-label="Tools" data-dock="bottom">
    <button class="grip" id="dock-grip" title="Drag to move the toolbar to any edge" aria-label="Move toolbar">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg>
    </button>
    <div class="tools" role="radiogroup" aria-label="Brush (tap the active tool again to go back to the previous one)">
      <button class="tool fam" data-brush="pen" title="Pen (1)" aria-label="Pen"><svg viewBox="0 0 24 24"><path d="m4 20 1-4L16 5l3 3L8 19z"/><path d="m14 7 3 3"/></svg></button>
      <button class="tool fam" data-brush="pencil" title="Pencil (2) – tilt to shade" aria-label="Pencil"><svg viewBox="0 0 24 24"><path d="m4 20 2-5 10-10 3 3-10 10z"/><path d="m4 20 2-5 3 3z" class="fill"/></svg></button>
      <button class="tool fam" data-brush="fountain" title="Fountain pen (3)" aria-label="Fountain pen"><svg viewBox="0 0 24 24"><path d="M12 3c3 4 5 7 5 10l-5 8-5-8c0-3 2-6 5-10z"/><path d="M12 13v8"/></svg></button>
      <button class="tool fam" data-brush="marker" title="Marker (4)" aria-label="Marker"><svg viewBox="0 0 24 24"><path d="m6 18 9-12 4 3-9 12H6z"/><path d="M4 21h8"/></svg></button>
      <button class="tool" data-brush="highlighter" title="Highlighter (5)" aria-label="Highlighter"><svg viewBox="0 0 24 24"><path d="m9 15 7-11 4 3-7 11z"/><path d="M9 15v4h4"/><path d="M3 21h9" class="hl"/></svg></button>
      <button class="tool" data-tool="eraser" title="Eraser (E). Whole stroke or partial in tool settings" aria-label="Eraser"><svg viewBox="0 0 24 24"><path d="m7 21-4-4L14 6l6 6-9 9z"/><path d="M7 21h13"/><path d="m9 11 6 6"/></svg><span class="badge" id="eraser-mode">S</span></button>
      <button class="tool" data-tool="lasso" title="Select (L): draw around ink to select it, drag to move it, hold it for more" aria-label="Select"><svg viewBox="0 0 24 24"><path d="M7.5 17.2C4.8 16 3 14 3 11.5 3 7.4 7 4 12 4s9 3.4 9 7.5-4 7.5-9 7.5c-1 0-2-.1-2.9-.4" stroke-dasharray="3 2.4"/><path d="M8 15.5c-1.6.6-2 2-1.2 3s2.5 1.2 3.2.2"/><path d="M9.8 19c-.2 1-.9 1.7-1.8 2"/></svg></button>
    </div>
    <div class="sep"></div>
    <div class="colors" id="colors" role="radiogroup" aria-label="Color"></div>
    <label class="swatch add" id="color-add" title="New colour: pick one to add it to your colours (long-press a colour to delete it)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg>
      <input type="color" id="color-input" aria-label="Pick a new colour">
    </label>
    <div class="sep"></div>
    <div class="presets" id="size-presets" role="radiogroup" aria-label="Size presets (hold one to change it)"></div>
    <button class="tool" id="btn-stroke" title="Settings for the selected tool" aria-label="Tool settings" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2.2" class="ring"/><circle cx="9" cy="17" r="2.2" class="ring"/></svg>
    </button>
    <div class="sep"></div>
    <button class="tool" id="btn-undo" title="Undo (two-finger double tap)" aria-label="Undo">
      <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
    </button>
    <button class="tool" id="btn-redo" title="Redo (three-finger double tap)" aria-label="Redo">
      <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
    </button>
  </nav>

  <div class="popover" id="stroke-pop" hidden role="dialog" aria-label="Tool settings">
    <div class="pop-label" id="stroke-brush">Pen</div>
    <label class="pop-row" for="pop-size">Size <output id="pop-size-value"></output></label>
    <input type="range" id="pop-size" min="0.5" max="30" step="0.5" aria-label="Size">
    <div class="pop-eraser" id="pop-eraser">
      <div class="segmented three" role="radiogroup" aria-label="Eraser mode">
        <button role="radio" data-eraser="erase-stroke">Whole stroke</button>
        <button role="radio" data-eraser="erase-partial">Partial</button>
        <button role="radio" data-eraser="erase-trim" title="Cuts the stroke back to where it crosses other lines">Trim</button>
      </div>
      <p class="pop-hint" id="eraser-hint"></p>
    </div>
    <div class="pop-brush" id="pop-brush">
    <div class="pop-row">Line style</div>
    <div class="segmented" role="radiogroup" aria-label="Line style" id="line-style">
      <button role="radio" data-style="solid" aria-label="Solid"><svg viewBox="0 0 48 12"><path d="M4 6h40"/></svg></button>
      <button role="radio" data-style="dashed" aria-label="Dashed"><svg viewBox="0 0 48 12"><path d="M4 6h10m6 0h10m6 0h8"/></svg></button>
      <button role="radio" data-style="dotted" aria-label="Dotted"><svg viewBox="0 0 48 12"><path d="M5 6h.01M13 6h.01M21 6h.01M29 6h.01M37 6h.01M45 6h.01" class="dots"/></svg></button>
    </div>
    <label class="pop-row" for="stabilizer">Stabiliser <output id="stabilizer-value">Off</output></label>
    <input type="range" id="stabilizer" min="0" max="100" step="5" aria-label="Stabiliser">
    <p class="pop-hint">Smooths shaky lines. Higher values lag slightly behind the tip.</p>
    <details class="pen-tuning" id="pen-tuning">
      <summary>Pen feel</summary>
      <label class="pop-row" for="tune-taper_start">Start taper <output id="tune-taper_start-value"></output></label>
      <input type="range" id="tune-taper_start" data-tune="taper_start" min="0" max="100" step="5">
      <label class="pop-row" for="tune-taper_end">End taper <output id="tune-taper_end-value"></output></label>
      <input type="range" id="tune-taper_end" data-tune="taper_end" min="0" max="100" step="5">
      <label class="pop-row" for="tune-taper_fade">Taper fade <output id="tune-taper_fade-value"></output></label>
      <input type="range" id="tune-taper_fade" data-tune="taper_fade" min="0" max="100" step="5">
      <label class="pop-row" for="tune-pressure">Pressure <output id="tune-pressure-value"></output></label>
      <input type="range" id="tune-pressure" data-tune="pressure" min="0" max="100" step="5">
      <label class="pop-row" for="tune-speed">Thinner when fast <output id="tune-speed-value"></output></label>
      <input type="range" id="tune-speed" data-tune="speed" min="0" max="100" step="5">
      <p class="pop-hint">Saved with each stroke you draw. A quick flick thins the end more.</p>
      <button type="button" class="pop-reset" id="tune-reset">Back to this pen's usual feel</button>
    </details>
    </div>
  </div>

  <div class="menu" id="menu" hidden role="menu">
    <button role="menuitem" data-action="new">New note</button>
    <button role="menuitem" data-action="open">Open file… (iCloud Drive, Files)</button>
    <button role="menuitem" data-action="import-pdf">Import PDF (GoodNotes)…</button>
    <button role="menuitem" data-action="save">Save to iCloud Drive / Files…</button>
    <button role="menuitem" data-action="export-svg">Export as SVG image</button>
    <button role="menuitem" data-action="insert-image">Insert picture…</button>
    <button role="menuitem" data-action="paste">Paste</button>
    <a role="menuitem" class="menu-link" href="train/">Help train handwriting…</a>
    <button role="menuitem" data-action="export-all">Export all notes (.zip, opens in Obsidian)</button>
    <hr>
    <button role="menuitem" data-action="fit">Show all ink</button>
    <label class="row">Paper
      <select id="paper">
        <option value="dots">Dots</option>
        <option value="grid">Grid</option>
        <option value="lines">Lines</option>
        <option value="plain">Plain</option>
      </select>
    </label>
    <button role="menuitem" data-action="reset-layout">Reset toolbar and minimap positions</button>
    <label class="row">Toolbar
      <select id="dock">
        <option value="bottom">Bottom</option>
        <option value="top">Top</option>
        <option value="left">Left</option>
        <option value="right">Right</option>
      </select>
    </label>
    <div class="row pressure-row">
      <label for="pressure">Pen pressure</label>
      <output id="pressure-value">Normal</output>
      <input type="range" id="pressure" min="-100" max="100" step="5" aria-label="Pen pressure, firm to soft">
      <span class="scale"><span>Firm</span><span>Soft</span></span>
      <svg id="pressure-curve" class="curve" viewBox="0 0 100 100" role="img" aria-label="Pressure curve: how hard you press (across) against how the line responds (up). Drag the points, tap to add one, double-tap one to remove it.">
        <path class="grid" d="M25 0V100M50 0V100M75 0V100M0 25H100M0 50H100M0 75H100"/>
        <path class="diag" d="M0 100L100 0"/>
        <path class="line" id="pressure-curve-line"/>
        <g id="pressure-curve-points"></g>
      </svg>
      <span class="scale"><span>Light touch</span><button type="button" class="link" id="pressure-curve-reset">Reset curve</button><span>Hard</span></span>
    </div>
    <div class="row pressure-row">
      <label for="smoothing">Steady hand</label>
      <output id="smoothing-value">Off</output>
      <input type="range" id="smoothing" min="0" max="100" step="5" aria-label="Steady-hand smoothing for every pen">
      <span class="scale"><span>Off</span><span>Smoothest</span></span>
    </div>
    <label class="row">Line smoothing
      <select id="smoother" aria-label="How pen lines are smoothed">
        <option value="modeler">Natural (Ink Stroke Modeler)</option>
        <option value="classic">Classic</option>
      </select>
    </label>
    <label class="row"><input type="checkbox" id="finger-draw"> Draw with finger</label>
    <label class="row"><input type="checkbox" id="recognize"> Recognise handwriting (on this device)</label>
    <label class="row">Reading
      <select id="recognize-mode" aria-label="How handwriting is read">
        <option value="both">Live, then careful</option>
        <option value="live">Live only (fast model)</option>
        <option value="careful">Careful only (larger model, after a pause)</option>
      </select>
    </label>
    <label class="row"><input type="checkbox" id="scribble-erase"> Scribble over ink to erase it</label>
    <label class="row"><input type="checkbox" id="spelling"> Check spelling</label>
    <label class="row"><input type="checkbox" id="show-recognizer"> Show and correct what the recogniser reads</label>
    <label class="row"><input type="checkbox" id="share-words"> Send every word I write in notes, to improve recognition</label>
    <label class="row"><input type="checkbox" id="hover-preview"> Show the tool under a hovering Pencil</label>
    <label class="row"><input type="checkbox" id="show-minimap"> Show minimap</label>
    <label class="row"><input type="checkbox" id="show-latency"> Show latency</label>
    <button class="row" id="record-trace" type="button">Record a pen trace</button>
    <hr>
    <label class="row"><input type="checkbox" id="auto-perf"> Send performance reports automatically</label>
    <button role="menuitem" data-action="report">Report a problem…</button>
  </div>

  <div class="word-menu" id="word-menu" hidden role="dialog" aria-label="Word">
    <div class="wm-head"><span class="wm-word" id="wm-word"></span><button class="wm-close" id="wm-close" aria-label="Close">×</button></div>
    <div class="wm-main" id="wm-main">
      <div class="wm-reading" id="wm-reading"></div>
      <div class="wm-link-now" id="wm-link-now" hidden></div>
      <button type="button" id="wm-open" hidden>Open link</button>
      <button type="button" id="wm-link">Make a link…</button>
      <button type="button" id="wm-unlink" hidden>Remove link</button>
      <button type="button" id="wm-copy-here" hidden>Copy a link to here</button>
      <button type="button" id="wm-right" hidden>This is right</button>
      <button type="button" id="wm-correct">Correct the text…</button>
      <button type="button" id="wm-kind">Read it as maths</button>
      <button type="button" id="wm-drawing">Not a word</button>
      <button type="button" id="wm-group" hidden>Make it one word</button>
      <button type="button" id="wm-ungroup" hidden>Split back into words</button>
      <button type="button" id="wm-duplicate" hidden>Duplicate</button>
      <button type="button" id="wm-delete" class="wm-danger" hidden>Delete</button>
    </div>
    <form class="wm-form" id="wm-link-form" hidden novalidate>
      <select id="wm-link-type" aria-label="Link to"></select>
      <input id="wm-link-target" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Link target">
      <div class="wm-error" id="wm-link-error" hidden></div>
      <div class="wm-actions"><button type="button" class="wm-cancel">Cancel</button><button type="submit" class="wm-save">Save link</button></div>
    </form>
    <form class="wm-form" id="wm-correct-form" hidden novalidate>
      <input id="wm-correct-text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="What this says">
      <div class="wm-actions"><button type="button" class="wm-cancel">Cancel</button><button type="submit" class="wm-save">Save</button></div>
    </form>
  </div>

  <aside class="recognizer-view" id="recognizer-view" hidden aria-label="What the recogniser sees">
    <div class="rv-head"><strong>Recogniser input</strong><span class="rv-count"></span><button class="rv-close" id="rv-close" aria-label="Close">×</button></div>
    <ol class="rv-list"></ol>
  </aside>

  <aside class="library" id="library" hidden aria-label="Notes">
    <div class="library-head">
      <button class="text library-up" id="library-up" hidden>‹ Notes</button>
      <h2 id="library-title">Notes</h2>
      <div class="library-actions">
        <button class="text" id="btn-new-folder" title="New folder">New folder</button>
        <button class="text" data-action="new">New note</button>
      </div>
    </div>
    <ul id="note-list"></ul>
  </aside>

  <div class="minimap" id="minimap" hidden>
    <canvas aria-label="Minimap: tap or drag to move around the note; drag the strip below it to move the minimap"></canvas>
    <div class="minimap-bar">
      <span class="minimap-handle" title="Drag here to move the minimap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg><span class="minimap-zoom" id="zoom-level" role="status" aria-label="Zoom level">100%</span></span>
      <button class="minimap-fit" id="btn-fit" title="Show the whole drawing" aria-label="Show the whole drawing">
        <svg viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/><rect x="8.5" y="8.5" width="7" height="7" rx="1"/></svg>
        Fit
      </button>
    </div>
  </div>

  <div id="hud" class="hud" hidden></div>
  <div id="toast" class="toast" role="alert" hidden></div>
  <input type="file" id="file-input" hidden>

  <noscript>Bedrock needs JavaScript and WebAssembly.</noscript>
  <div id="fatal" class="fatal" hidden></div>
  <script src="src/errors.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
