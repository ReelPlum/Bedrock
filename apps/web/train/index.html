<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf6">
  <title>Train Bedrock</title>
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="train.css">
</head>
<body class="home">
  <header class="bar">
    <a class="back" href="../">← Bedrock</a>
    <h1>Train</h1>
  </header>
  <main class="choices">
    <p class="lead">Write the prompts you are shown, so Bedrock can learn from real handwriting.</p>
    <a class="choice" href="handwriting/">
      <span class="choice-title">Handwriting</span>
      <span class="choice-text">Write random words and maths, then tap Done.</span>
    </a>
    <a class="choice" href="scribble/">
      <span class="choice-title">Scribble to erase</span>
      <span class="choice-text">Scribble out a word in one stroke, as you would to erase it.</span>
    </a>

    <section class="card" id="setup" aria-labelledby="setup-title">
      <h2 id="setup-title">Saving your samples</h2>
      <p class="state" id="state" aria-live="polite"></p>
      <form id="setup-form" novalidate>
        <!-- The consent text is apps/web/src/consent.js, shared with the app's launch gate. -->
        <div class="consent" id="consent-text"></div>
        <label class="field">Invite code
          <input id="code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="bedrock-xxxxx-xxxxx-xxxxx-xxxxx-xxxxx">
        </label>
        <label class="field">Writing hand (optional)
          <select id="handedness">
            <option value="">Rather not say</option>
            <option value="right">Right</option>
            <option value="left">Left</option>
          </select>
        </label>
        <label class="agree"><input type="checkbox" id="agree"> I agree that my handwriting is sent and used as described.</label>
        <p class="error" id="setup-error" hidden></p>
        <div class="actions">
          <button type="submit" class="primary" id="save">Save</button>
          <button type="button" id="stop" hidden>Stop saving</button>
          <button type="button" class="danger" id="delete" hidden>Delete my contributions</button>
        </div>
      </form>
    </section>
  </main>
  <script src="../src/errors.js"></script>
  <script type="module" src="setup.js"></script>
</body>
</html>
