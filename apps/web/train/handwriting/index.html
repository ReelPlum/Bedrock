<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf6">
  <title>Train handwriting</title>
  <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../train.css">
</head>
<body data-mode="handwriting">
  <header class="bar">
    <a class="back" href="../">← Train</a>
    <h1>Train handwriting</h1>
    <span class="count" id="count" aria-live="polite">0 done</span>
  </header>
  <main class="trainer">
    <section class="prompt" aria-live="polite">
      <div class="prompt-kind" id="prompt-kind"></div>
      <div class="prompt-text" id="prompt-text"></div>
      <p class="hint" id="hint">Write what you see, then tap Done.</p>
    </section>
    <div class="box" id="stage" aria-label="Writing box">
      <canvas id="base"></canvas>
      <canvas id="overlay"></canvas>
      <div class="target" id="target" aria-hidden="true"></div>
    </div>
    <div class="controls">
      <div class="options" id="options"></div>
      <button type="button" id="undo">Undo</button>
      <button type="button" id="clear">Clear</button>
      <button type="button" id="skip">Skip</button>
      <button type="button" class="primary" id="done" disabled>Done</button>
    </div>
    <p class="saving" id="saving" aria-live="polite"></p>
    <details class="last" id="last" hidden>
      <summary>Last sample</summary>
      <pre id="last-json"></pre>
    </details>
  </main>
  <div class="fatal" id="fatal" hidden></div>
  <script src="../../src/errors.js"></script>
  <script type="module" src="../train.js"></script>
</body>
</html>
