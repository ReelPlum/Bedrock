[package]
name = "bedrock-core"
description = "Platform independent canvas engine for Bedrock: strokes, brushes, camera, note format."
version.workspace = true
edition.workspace = true
repository.workspace = true

[features]
default = ["pdf"]
# PDF import (hayro-syntax, png). The web app leaves it out of its main
# WebAssembly and loads crates/bedrock-pdf on first use.
pdf = ["dep:hayro-syntax", "dep:png"]

[dependencies]
serde = { version = "1", features = ["derive"] }
ink-stroke-modeler = { path = "../ink-stroke-modeler" }
serde_json = { version = "1", features = ["float_roundtrip"] }
hayro-syntax = { version = "0.9", default-features = false, features = ["std"], optional = true }
png = { version = "0.18", optional = true }
base64 = "0.23"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1"
roxmltree = "0.21"
spellbook = "0.4"
rstar = "0.14"
leb128 = "0.2"

[dev-dependencies]
jsonschema = { version = "0.61", default-features = false }
proptest = { version = "1", default-features = false, features = ["std"] }
